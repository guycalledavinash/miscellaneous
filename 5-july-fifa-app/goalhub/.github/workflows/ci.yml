name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r 5-july-fifa-app/goalhub/backend/requirements-dev.txt
      - run: ruff check 5-july-fifa-app/goalhub/backend/app
      - run: black --check 5-july-fifa-app/goalhub/backend/app
      - run: pytest 5-july-fifa-app/goalhub/backend/app/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci || npm install
        working-directory: 5-july-fifa-app/goalhub/frontend
      - run: npm run lint
        working-directory: 5-july-fifa-app/goalhub/frontend
      - run: npm run build
        working-directory: 5-july-fifa-app/goalhub/frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f 5-july-fifa-app/goalhub/docker-compose.yml build
